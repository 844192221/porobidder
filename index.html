<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoroBidder 人才市场</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section id="welcomeView" class="view">
        <div class="marketLayout">
          <section class="introPanel">
            <p class="eyebrow">PoroBidder</p>
            <h1>峡谷人才市场</h1>
            <p class="description">带上 100 金币预算，来市场里看看今天有哪些选手挂牌。</p>
            <button id="startButton" type="button">我要进市场</button>
          </section>

          <section class="marketScene" aria-hidden="true">
            <div class="stall">
              <div class="awning"></div>
              <div class="stallContent">
                <div class="sign">今日招募</div>
                <div class="marketCards">
                  <div class="candidateCard topCard">
                    <span>TOP</span>
                    <strong>?</strong>
                  </div>
                  <div class="coinStack">
                    <span></span>
                    <span></span>
                    <span></span>
                  </div>
                  <div class="candidateCard midCard">
                    <span>MID</span>
                    <strong>?</strong>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <section id="loginView" class="view hidden">
        <section class="panel compactPanel">
          <p class="eyebrow">入场登记</p>
          <h1>先报个名字</h1>
          <p class="description">暂时不做查重，后面接后端时再处理。</p>

          <div class="profilePreview">
            <div id="avatarPreview" class="avatarPreview">?</div>
            <div>
              <strong>市场通行证</strong>
              <p>你的 ID 会显示在个人主界面里。</p>
            </div>
          </div>

          <label for="userIdInput">竞拍人 ID</label>
          <input id="userIdInput" type="text" autocomplete="off" placeholder="例如：Manager01" />
          <p id="loginMessage" class="message"></p>
          <button id="loginButton" type="button">进入我的摊位</button>
        </section>
      </section>

      <section id="homeView" class="view hidden">
        <section class="dashboard">
          <header class="dashboardHeader">
            <div>
              <p class="eyebrow">我的摊位</p>
              <h1 id="userIdText">-</h1>
            </div>
            <button id="logoutButton" type="button" class="secondary">退出</button>
          </header>

          <div class="infoGrid">
            <article class="infoCard moneyCard">
              <span>钱包</span>
              <strong id="moneyText">100</strong>
              <small>可用金币</small>
            </article>
            <article class="infoCard">
              <span>市场公告</span>
              <strong id="auctionStatusText">暂无</strong>
              <small>当前活动状态</small>
            </article>
          </div>

          <section class="activityBox">
            <div>
              <div class="activityTitle">
                <h2 id="activityNameText">拍卖摊位</h2>
                <span id="activityStatusBadge" class="statusBadge">暂无</span>
              </div>
              <p id="activityText">现在还没有开摊的拍卖活动。</p>
              <div id="activityMeta" class="activityMeta"></div>
            </div>
            <button id="joinButton" type="button" disabled>加入活动</button>
          </section>

          <section class="devTools">
            <span>开发测试</span>
            <button id="startNowButton" type="button" class="secondary">立即开摊</button>
          </section>
        </section>
      </section>

      <section id="auctionView" class="view hidden">
        <section class="auctionRoom">
          <header class="dashboardHeader">
            <div>
              <p class="eyebrow">竞拍房间</p>
              <h1 id="auctionRoomName">-</h1>
            </div>
            <button id="backHomeButton" type="button" class="secondary">返回</button>
          </header>

          <div class="roomGrid">
            <article class="roomPanel">
              <h2>当前竞品</h2>
              <div id="currentPlayerCard" class="currentPlayerCard">
                <span id="roomItemStatus">等待上架</span>
                <strong id="roomItemSymbol">?</strong>
                <small id="roomItemHint">下一步我们会在这里显示选手 ID、位置和起拍价。</small>
                <div id="roomItemDetails" class="itemDetails"></div>
              </div>
            </article>

            <aside class="roomPanel">
              <h2>我的席位</h2>
              <div class="bidderList">
                <div class="bidderItem">
                  <div id="roomAvatar" class="smallAvatar">?</div>
                  <div>
                    <strong id="roomUserId">-</strong>
                    <small><span id="roomMoney">100</span> 金币</small>
                  </div>
                </div>
              </div>
              <div class="countdownBox">
                <span>本轮倒计时</span>
                <strong id="roundCountdown">--:--</strong>
              </div>
            </aside>
          </div>

          <section class="bidPanel">
            <label for="bidInput">我的暗标报价</label>
            <div class="bidInputRow">
              <input id="bidInput" type="number" min="0" placeholder="竞价功能下一步开启" disabled />
              <button id="submitBidButton" type="button" disabled>提交出价</button>
            </div>
            <p id="bidMessage" class="message"></p>
          </section>

          <section id="resultPanel" class="resultPanel hidden">
            <h2>开奖结果</h2>
            <p id="resultText"></p>
            <div id="resultDetails" class="resultDetails"></div>
            <button id="nextRoundButton" type="button" class="secondary hidden">进入加赛</button>
          </section>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
